
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Book | LibraryPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6fa;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .form-card {
            background: white;
            max-width: 850px;
            margin: 45px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,.05);
        }

        .form-control, .form-select {
            min-height: 46px;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <h2 class="fw-bold mb-2">Edit Book Details</h2>

        <p class="text-secondary mb-4">
            Update the information of your selected book.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Book Title *</label>
                <input type="text" name="title"
                       class="form-control"
                       value="{{ request.form.get('title', book[1]) }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">ISBN *</label>
                <input type="text" name="isbn"
                       class="form-control"
                       value="{{ request.form.get('isbn', book[2]) }}"
                       required>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Author *</label>

                    <select name="author_id" class="form-select" required>

                        {% for author in authors %}
                            <option value="{{ author[0] }}"
                                {% if request.form.get('author_id', book[3]|string) == author[0]|string %}
                                    selected
                                {% endif %}>
                                {{ author[1] }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Category *</label>

                    <select name="category_id" class="form-select" required>

                        {% for category in categories %}
                            <option value="{{ category[0] }}"
                                {% if request.form.get('category_id', book[4]|string) == category[0]|string %}
                                    selected
                                {% endif %}>
                                {{ category[1] }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Publisher</label>
                    <input type="text" name="publisher"
                           class="form-control"
                           value="{{ request.form.get('publisher', book[5] or '') }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Publication Year</label>
                    <input type="number" name="publication_year"
                           class="form-control"
                           min="1" max="2100"
                           value="{{ request.form.get('publication_year', book[6] or '') }}">
                </div>

            </div>

            <div class="d-flex gap-3 mt-3">

                <button type="submit" class="btn btn-primary btn-lg">
                    Save Changes
                </button>

                <a href="{{ url_for('books') }}"
                   class="btn btn-outline-secondary btn-lg">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
