
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book | LibraryPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6fa;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .form-card {
            background: white;
            max-width: 850px;
            margin: 45px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,.05);
        }

        .form-control, .form-select {
            min-height: 46px;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <h2 class="fw-bold mb-2">
            <i class="bi bi-book-half text-primary me-2"></i>
            Add New Book
        </h2>

        <p class="text-secondary mb-4">
            Enter the book details to add it to your library.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Book Title *</label>
                <input type="text" name="title"
                       class="form-control"
                       placeholder="Enter book title"
                       value="{{ request.form.get('title', '') }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">ISBN *</label>
                <input type="text" name="isbn"
                       class="form-control"
                       placeholder="Enter unique ISBN"
                       value="{{ request.form.get('isbn', '') }}"
                       required>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Author *</label>

                    <select name="author_id" class="form-select" required>
                        <option value="">Select Author</option>

                        {% for author in authors %}
                            <option value="{{ author[0] }}"
                                {% if request.form.get('author_id') == author[0]|string %}selected{% endif %}>
                                {{ author[1] }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Category *</label>

                    <select name="category_id" class="form-select" required>
                        <option value="">Select Category</option>

                        {% for category in categories %}
                            <option value="{{ category[0] }}"
                                {% if request.form.get('category_id') == category[0]|string %}selected{% endif %}>
                                {{ category[1] }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Publisher</label>
                    <input type="text" name="publisher"
                           class="form-control"
                           value="{{ request.form.get('publisher', '') }}"
                           placeholder="Publisher name">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Publication Year</label>
                    <input type="number" name="publication_year"
                           class="form-control"
                           value="{{ request.form.get('publication_year', '') }}"
                           placeholder="e.g. 2024"
                           min="1" max="2100">
                </div>

            </div>

            <div class="mb-4">
                <label class="form-label">Number of Copies *</label>
                <input type="number" name="copies"
                       class="form-control"
                       value="{{ request.form.get('copies', '1') }}"
                       min="1" max="1000" required>
                <small class="text-secondary">
                    Number of physical copies to add to inventory.
                </small>
            </div>

            <div class="d-flex gap-3">

                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-circle me-2"></i>
                    Save Book
                </button>

                <a href="{{ url_for('books') }}"
                   class="btn btn-outline-secondary btn-lg">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
